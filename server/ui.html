<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Plan review</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #171717;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --sidebar: #f8fafc;
    --quote: #f3f4f6;
    --assistant: #ffffff;
    --user: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --fg: #e5e7eb;
      --muted: #9ca3af;
      --line: #2a2f3a;
      --accent: #60a5fa;
      --accent-soft: #172554;
      --sidebar: #151821;
      --quote: #1e222c;
      --assistant: #1b1f29;
      --user: #2563eb;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 420px;
    height: 100vh;
  }
  button, textarea, select { font: inherit; }
  main { overflow-y: auto; padding: 2.5rem 3rem; }
  #plan-content { max-width: 48rem; }
  #plan-content h1 { margin-top: 0; }
  #plan-content pre {
    background: var(--quote); padding: 1rem; border-radius: 8px; overflow-x: auto;
  }
  #plan-content code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; }
  #plan-content pre code { background: none; }
  #plan-content :not(pre) > code { background: var(--quote); padding: 0.1em 0.35em; border-radius: 4px; }
  #plan-content blockquote { border-left: 3px solid var(--line); margin-left: 0; padding-left: 1rem; color: var(--muted); }
  #plan-content table { border-collapse: collapse; }
  #plan-content th, #plan-content td { border: 1px solid var(--line); padding: 0.4rem 0.7rem; }

  aside {
    border-left: 1px solid var(--line);
    background: var(--sidebar);
    display: flex;
    flex-direction: column;
    height: 100vh;
    min-width: 0;
  }
  .side-head {
    padding: 0.9rem 1rem;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .side-head h2 { margin: 0; font-size: 1rem; }
  #version { color: var(--muted); font-size: 0.85rem; }
  .section-head {
    margin: 0;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  .comments-panel {
    max-height: 30vh;
    overflow-y: auto;
    padding: 0.75rem 1rem 0.65rem;
    border-bottom: 1px solid var(--line);
  }
  #comments { padding-top: 0.45rem; }
  .empty { color: var(--muted); font-size: 0.88rem; margin: 0.45rem 0; }
  .comment {
    position: relative;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 0.6rem 0.75rem;
    margin-bottom: 0.55rem;
  }
  .comment .quote, .chat-context {
    font-size: 0.78rem;
    color: var(--muted);
    border-left: 2px solid var(--accent);
    padding-left: 0.5rem;
    white-space: pre-wrap;
  }
  .comment .quote { margin-bottom: 0.35rem; max-height: 4.2rem; overflow: hidden; }
  .comment .note { font-size: 0.9rem; white-space: pre-wrap; }
  .comment .remove {
    position: absolute;
    top: 0.3rem;
    right: 0.4rem;
    border: none;
    background: none;
    color: var(--muted);
    font-size: 1.1rem;
    cursor: pointer;
    line-height: 1;
  }
  .comment .remove:hover { color: var(--fg); }

  .chat-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .chat-toolbar {
    padding: 0.65rem 0.85rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    border-bottom: 1px solid var(--line);
  }
  .chat-toolbar .section-head { flex: 1; }
  #chat-select {
    max-width: 250px;
    min-width: 0;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--bg);
    color: var(--fg);
    padding: 0.25rem 0.4rem;
    font-size: 0.78rem;
  }
  .chat-context { margin: 0.75rem 0.9rem 0; max-height: 4.5rem; overflow-y: auto; }
  #chat-messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 0.9rem;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }
  .chat-empty {
    margin: auto;
    max-width: 270px;
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .bubble {
    max-width: 88%;
    padding: 0.58rem 0.72rem;
    border-radius: 12px;
    font-size: 0.9rem;
    line-height: 1.45;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--user);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bubble.assistant {
    align-self: flex-start;
    background: var(--assistant);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }
  .bubble.typing { color: var(--muted); font-style: italic; }
  .chat-compose {
    padding: 0.7rem 0.85rem 0.8rem;
    border-top: 1px solid var(--line);
    background: var(--sidebar);
  }
  .compose-box {
    display: flex;
    align-items: flex-end;
    gap: 0.45rem;
    padding: 0.4rem;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--bg);
  }
  #chat-input {
    flex: 1;
    min-height: 2.6rem;
    max-height: 8rem;
    resize: vertical;
    border: none;
    outline: none;
    background: transparent;
    color: var(--fg);
    line-height: 1.4;
  }
  #chat-send {
    width: 2.25rem;
    height: 2.25rem;
    flex: 0 0 auto;
    border: none;
    border-radius: 9px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    font-weight: 700;
  }
  #chat-send:disabled, #chat-input:disabled { opacity: 0.5; cursor: default; }
  #chat-status { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.76rem; }

  .side-foot { padding: 0.8rem 1rem; border-top: 1px solid var(--line); }
  .side-foot .btn-row { display: flex; gap: 0.6rem; }
  #iterate, #approve {
    flex: 1;
    padding: 0.65rem;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    border-radius: 8px;
  }
  #iterate { background: var(--accent); color: #fff; }
  #approve { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  #approve:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  #iterate:disabled, #approve:disabled { opacity: 0.55; cursor: default; }
  #status { margin: 0.45rem 0 0; font-size: 0.8rem; color: var(--muted); text-align: center; }

  #popover {
    position: absolute;
    z-index: 10;
    width: 300px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0.6rem;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
  }
  #popover textarea {
    width: 100%;
    height: 4.5rem;
    resize: vertical;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0.45rem;
    background: var(--bg);
    color: var(--fg);
  }
  #popover .mode-row { display: flex; gap: 0.35rem; margin-bottom: 0.5rem; }
  #popover .mode {
    flex: 1;
    padding: 0.3rem 0.4rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
    background: var(--bg);
    color: var(--muted);
    font-size: 0.82rem;
  }
  #popover .mode.active { background: var(--accent-soft); color: var(--fg); border-color: var(--accent); }
  #popover .row { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 0.5rem; }
  #popover button {
    padding: 0.35rem 0.8rem;
    border-radius: 6px;
    border: 1px solid var(--line);
    cursor: pointer;
    background: var(--bg);
    color: var(--fg);
  }
  #popover #save, #popover #ask { background: var(--accent); color: #fff; border-color: var(--accent); }
  .waiting-plan { color: var(--muted); padding: 2rem 0; }

  @media (max-width: 800px) {
    body { grid-template-columns: 1fr; grid-template-rows: 52vh 48vh; }
    main { padding: 1.5rem; }
    aside { height: 48vh; border-left: none; border-top: 1px solid var(--line); }
    .comments-panel { display: none; }
  }
</style>
</head>
<body>
  <main>
    <div id="plan-content"><p class="waiting-plan">Waiting for the agent to publish a plan...</p></div>
  </main>

  <aside>
    <div class="side-head"><h2>Plan review</h2><span id="version"></span></div>

    <section class="comments-panel">
      <h3 class="section-head">Comments</h3>
      <div id="comments"><p class="empty">No comments yet. Highlight plan text to add one.</p></div>
    </section>

    <section class="chat-panel" aria-label="Side chat">
      <div class="chat-toolbar">
        <h3 class="section-head">Ask the agent</h3>
        <select id="chat-select" aria-label="Choose a side chat" hidden></select>
      </div>
      <div id="chat-context" class="chat-context" hidden></div>
      <div id="chat-messages">
        <p class="chat-empty">Highlight any text in the plan and choose <strong>Ask question</strong> to start a side chat.</p>
      </div>
      <div class="chat-compose">
        <div class="compose-box">
          <textarea id="chat-input" rows="1" placeholder="Ask a follow-up..." disabled></textarea>
          <button id="chat-send" type="button" title="Send follow-up" aria-label="Send follow-up" disabled>↑</button>
        </div>
        <p id="chat-status">Start a chat by highlighting plan text.</p>
      </div>
    </section>

    <div class="side-foot">
      <div class="btn-row">
        <button id="approve" disabled>Approve</button>
        <button id="iterate" disabled>Iterate</button>
      </div>
      <p id="status"></p>
    </div>
  </aside>

  <div id="popover" hidden>
    <div class="mode-row">
      <button id="comment-mode" class="mode active" type="button">Comment</button>
      <button id="question-mode" class="mode" type="button">Ask question</button>
    </div>
    <textarea id="note" placeholder="Comment on the selected text..."></textarea>
    <div class="row">
      <button id="cancel" type="button">Cancel</button>
      <button id="save" type="button">Comment</button>
      <button id="ask" type="button" hidden>Start chat</button>
    </div>
  </div>

<script>
  const planContent = document.getElementById("plan-content");
  const commentsEl = document.getElementById("comments");
  const iterateBtn = document.getElementById("iterate");
  const approveBtn = document.getElementById("approve");
  const statusEl = document.getElementById("status");
  const versionEl = document.getElementById("version");
  const popover = document.getElementById("popover");
  const noteEl = document.getElementById("note");
  const commentModeBtn = document.getElementById("comment-mode");
  const questionModeBtn = document.getElementById("question-mode");
  const askBtn = document.getElementById("ask");
  const chatSelect = document.getElementById("chat-select");
  const chatContext = document.getElementById("chat-context");
  const chatMessages = document.getElementById("chat-messages");
  const chatInput = document.getElementById("chat-input");
  const chatSend = document.getElementById("chat-send");
  const chatStatus = document.getElementById("chat-status");

  let selectedText = "";
  let hasPlan = false;
  let closing = false;
  let questionMode = false;
  let chats = [];
  let activeChatId = null;

  function renderComments(list) {
    commentsEl.innerHTML = "";
    if (!list.length) {
      commentsEl.innerHTML = '<p class="empty">No comments yet. Highlight plan text to add one.</p>';
      return;
    }
    for (const comment of list) {
      const card = document.createElement("div");
      card.className = "comment";

      const remove = document.createElement("button");
      remove.className = "remove";
      remove.textContent = "×";
      remove.title = "Remove comment";
      remove.onclick = () => fetch("/comments/" + comment.id, { method: "DELETE" });

      const quote = document.createElement("div");
      quote.className = "quote";
      quote.textContent = comment.quotedText ? "“" + comment.quotedText + "”" : "(general note)";

      const note = document.createElement("div");
      note.className = "note";
      note.textContent = comment.comment;

      card.append(remove, quote, note);
      commentsEl.appendChild(card);
    }
  }

  function activeChat() {
    return chats.find((chat) => chat.id === activeChatId) || null;
  }

  function chatLabel(chat) {
    const first = chat.messages.find((message) => message.role === "user");
    const label = (first?.text || chat.quotedText || "Side chat").replace(/\s+/g, " ").trim();
    return label.length > 34 ? label.slice(0, 34) + "..." : label;
  }

  function renderChats(nextChats) {
    chats = nextChats;
    if (!chats.length) activeChatId = null;
    if (chats.length && !chats.some((chat) => chat.id === activeChatId)) {
      activeChatId = chats[chats.length - 1].id;
    }

    chatSelect.innerHTML = "";
    for (const chat of chats) {
      const option = document.createElement("option");
      option.value = chat.id;
      option.textContent = chatLabel(chat);
      option.selected = chat.id === activeChatId;
      chatSelect.appendChild(option);
    }
    chatSelect.hidden = chats.length < 2;

    const chat = activeChat();
    chatMessages.innerHTML = "";
    if (!chat) {
      chatContext.hidden = true;
      chatMessages.innerHTML = '<p class="chat-empty">Highlight any text in the plan and choose <strong>Ask question</strong> to start a side chat.</p>';
      refreshControls();
      return;
    }

    chatContext.hidden = !chat.quotedText;
    chatContext.textContent = chat.quotedText ? "Context: “" + chat.quotedText + "”" : "";

    for (const message of chat.messages) {
      const bubble = document.createElement("div");
      bubble.className = "bubble " + message.role;
      bubble.textContent = message.text;
      chatMessages.appendChild(bubble);

      if (message.role === "user" && message.status === "waiting") {
        const typing = document.createElement("div");
        typing.className = "bubble assistant typing";
        typing.textContent = "Thinking...";
        chatMessages.appendChild(typing);
      }
    }
    chatMessages.scrollTop = chatMessages.scrollHeight;
    refreshControls();
  }

  function hasPendingAnswer() {
    return chats.some((chat) => chat.messages.some((message) => message.status === "waiting"));
  }

  function activeChatPending() {
    const chat = activeChat();
    return Boolean(chat?.messages.some((message) => message.status === "waiting"));
  }

  function refreshControls() {
    const pending = hasPendingAnswer();
    const canFollowUp = Boolean(activeChat()) && !activeChatPending() && !closing;
    chatInput.disabled = !canFollowUp;
    chatSend.disabled = !canFollowUp || !chatInput.value.trim();
    iterateBtn.disabled = !hasPlan || closing || pending;
    approveBtn.disabled = !hasPlan || closing || pending;

    if (!activeChat()) chatStatus.textContent = "Start a chat by highlighting plan text.";
    else if (activeChatPending()) chatStatus.textContent = "Thinking in a private side chat...";
    else chatStatus.textContent = "Ask a follow-up in this same conversation.";
    if (pending) statusEl.textContent = "A private side-chat answer is in progress.";
    else if (statusEl.textContent === "A private side-chat answer is in progress.") statusEl.textContent = "";
  }

  const events = new EventSource("/events");
  events.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.type === "plan") {
      planContent.innerHTML = data.html;
      versionEl.textContent = "v" + data.version;
      statusEl.textContent = "";
      hasPlan = true;
      hidePopover();
      refreshControls();
    } else if (data.type === "comments") {
      renderComments(data.comments);
    } else if (data.type === "chats") {
      renderChats(data.chats);
    } else if (data.type === "closed") {
      onClosed();
    }
  };
  events.onerror = () => {
    if (!closing) statusEl.textContent = "Disconnected. Is the review server still running?";
  };

  planContent.addEventListener("mouseup", () => {
    if (!hasPlan) return;
    const selection = window.getSelection();
    const text = selection.toString().trim();
    if (!text || !selection.rangeCount) return;
    selectedText = text;
    const rect = selection.getRangeAt(0).getBoundingClientRect();
    popover.style.top = window.scrollY + rect.bottom + 8 + "px";
    popover.style.left = Math.min(window.scrollX + rect.left, window.innerWidth - 315) + "px";
    popover.hidden = false;
    noteEl.value = "";
    setMode(false);
    noteEl.focus();
  });

  document.addEventListener("mousedown", (event) => {
    if (!popover.hidden && !popover.contains(event.target)) hidePopover();
  });

  function hidePopover() {
    popover.hidden = true;
    selectedText = "";
    setMode(false);
  }

  function setMode(isQuestion) {
    questionMode = isQuestion;
    commentModeBtn.classList.toggle("active", !isQuestion);
    questionModeBtn.classList.toggle("active", isQuestion);
    noteEl.placeholder = isQuestion
      ? "Ask the agent about the selected text..."
      : "Comment on the selected text...";
    document.getElementById("save").hidden = isQuestion;
    askBtn.hidden = !isQuestion;
  }

  commentModeBtn.onclick = () => setMode(false);
  questionModeBtn.onclick = () => setMode(true);

  async function saveOpenComment() {
    if (popover.hidden) return true;
    if (questionMode) return false;
    const comment = noteEl.value.trim();
    if (!comment) return false;
    const response = await fetch("/comments", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ quotedText: selectedText, comment }),
    });
    if (!response.ok) return false;
    hidePopover();
    window.getSelection().removeAllRanges();
    return true;
  }

  document.getElementById("save").onclick = async () => {
    if (!(await saveOpenComment())) noteEl.focus();
  };

  async function startChat() {
    if (popover.hidden || !questionMode) return false;
    const message = noteEl.value.trim();
    if (!message) return false;
    const response = await fetch("/chats", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ quotedText: selectedText, message }),
    });
    if (!response.ok) return false;
    const created = await response.json();
    activeChatId = created.chatId;
    renderChats(chats);
    hidePopover();
    window.getSelection().removeAllRanges();
    return true;
  }

  askBtn.onclick = async () => {
    if (!(await startChat())) noteEl.focus();
  };
  document.getElementById("cancel").onclick = hidePopover;

  noteEl.addEventListener("keydown", (event) => {
    if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
      (questionMode ? askBtn : document.getElementById("save")).click();
    }
  });

  chatSelect.onchange = () => {
    activeChatId = Number(chatSelect.value);
    renderChats(chats);
  };

  chatInput.addEventListener("input", refreshControls);
  chatInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      chatSend.click();
    }
  });

  chatSend.onclick = async () => {
    const chat = activeChat();
    const message = chatInput.value.trim();
    if (!chat || !message || activeChatPending()) return;
    chatInput.disabled = true;
    chatSend.disabled = true;
    chatStatus.textContent = "Sending...";
    const response = await fetch(`/chats/${chat.id}/messages`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ message }),
    });
    if (response.ok) {
      chatInput.value = "";
    } else {
      const error = await response.json().catch(() => ({}));
      chatStatus.textContent = error.error || "Could not send the follow-up.";
    }
    refreshControls();
  };

  iterateBtn.onclick = async () => {
    if (questionMode) {
      statusEl.textContent = "Start or cancel the open chat before iterating.";
      noteEl.focus();
      return;
    }
    if (!(await saveOpenComment())) {
      statusEl.textContent = "Save or cancel the open comment before iterating.";
      noteEl.focus();
      return;
    }
    iterateBtn.disabled = true;
    approveBtn.disabled = true;
    statusEl.textContent = "Sent. The agent is revising the plan...";
    await fetch("/iterate", { method: "POST" });
  };

  approveBtn.onclick = async () => {
    if (!hasPlan) return;
    closing = true;
    refreshControls();
    statusEl.textContent = "Approving...";
    try {
      await fetch("/approve", { method: "POST" });
    } catch {}
  };

  function onClosed() {
    closing = true;
    hidePopover();
    refreshControls();
    statusEl.textContent = "Plan approved. The server stopped; you can close this tab.";
    document.title = "Plan approved";
    try {
      window.close();
    } catch {}
  }
</script>
</body>
</html>
